[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bottradenc-ai-native"
version = "0.1.0"
description = "AI-native quantitative research system for crypto markets"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Mauro Presso" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
